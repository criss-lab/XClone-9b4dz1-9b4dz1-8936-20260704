[install]
# Allow esbuild postinstall to chmod +x its native binary
trustedDependencies = [
  "esbuild",
  "@esbuild/linux-x64",
  "@esbuild/linux-arm64",
  "@esbuild/linux-musl-x64",
  "@esbuild/linux-musl-arm64",
  "@esbuild/darwin-x64",
  "@esbuild/darwin-arm64",
  "@esbuild/win32-x64"
]
lifecycle-scripts = true
