[install]
# Allow postinstall scripts to run so esbuild can chmod +x its native binary
lifecycle-scripts = true

# Explicitly trust esbuild packages so their postinstall sets +x on the binary
trustedDependencies = [
  "esbuild",
  "@esbuild/linux-x64",
  "@esbuild/linux-arm64",
  "@esbuild/linux-musl-x64",
  "@esbuild/linux-musl-arm64",
  "@esbuild/darwin-x64",
  "@esbuild/darwin-arm64",
  "@esbuild/win32-x64"
]
