# Root-level: tells Bun to run postinstall scripts for these packages
# so esbuild can chmod +x its native binary after install
trustedDependencies = [
  "esbuild",
  "@esbuild/linux-x64",
  "@esbuild/linux-arm64",
  "@esbuild/linux-musl-x64",
  "@esbuild/linux-musl-arm64",
  "@esbuild/darwin-x64",
  "@esbuild/darwin-arm64",
  "@esbuild/win32-x64"
]

[install]
lifecycle-scripts = true
